<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЕГЭ по обществознанию за 30 дней</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0e17;color:#e8e0d0;font-family:'Source Sans 3',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1a1825}::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.playfair{font-family:'Playfair Display',serif}
a{text-decoration:none}

/* LAYOUT */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#header{background:linear-gradient(135deg,#1a1428 0%,#0f0e17 60%);border-bottom:1px solid #2a2535;padding:18px 24px 16px;flex-shrink:0;position:relative;overflow:hidden}
#header::after{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(200,169,110,.1),transparent 70%);pointer-events:none}
.header-label{font-size:10px;letter-spacing:3px;color:#c8a96e;text-transform:uppercase;margin-bottom:5px}
.header-title{font-family:'Playfair Display',serif;font-size:clamp(18px,3.5vw,28px);font-weight:900;color:#f0e8d8;line-height:1.15;margin-bottom:12px}
.header-title span{color:#c8a96e}
.progress-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.progress-bar-wrap{flex:1;min-width:140px}
.progress-labels{display:flex;justify-content:space-between;margin-bottom:4px}
.progress-labels span{font-size:11px;color:#7a7280}
.progress-labels strong{font-size:11px;color:#c8a96e;font-weight:600}
.progress-track{height:4px;background:#2a2535;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#c8a96e,#e8c87a);border-radius:2px;transition:width .5s}
.progress-count{font-size:11px;color:#5a5468}

/* TABS */
#tabs{display:flex;border-bottom:1px solid #2a2535;background:#12111e;padding:0 24px;flex-shrink:0}
.tab-btn{background:none;border:none;cursor:pointer;padding:11px 16px;font-size:13px;font-family:'Source Sans 3',sans-serif;color:#5a5468;border-bottom:2px solid transparent;transition:all .2s;margin-bottom:-1px}
.tab-btn.active{color:#c8a96e;border-bottom-color:#c8a96e}
.tab-btn:hover{color:#e8e0d0}

/* MAIN */
#main-body{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:200px;flex-shrink:0;border-right:1px solid #2a2535;overflow-y:auto;background:#0d0c18;padding:10px 0}
.week-header{width:100%;background:none;border:none;cursor:pointer;padding:9px 12px;text-align:left;border-left:3px solid transparent;transition:all .2s}
.week-header:hover{background:rgba(255,255,255,.05)}
.week-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.week-title-text{font-size:11px;color:#b8b0a0;line-height:1.3}
.day-btn-side{width:100%;background:none;border:none;cursor:pointer;padding:6px 12px 6px 24px;text-align:left;display:flex;align-items:center;gap:8px;transition:background .15s}
.day-btn-side:hover{background:rgba(255,255,255,.06)}
.day-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s}
.day-label-text{font-size:11px;color:#5a5468;transition:color .2s}
.day-btn-side.active .day-label-text{color:#e0d8c8}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:20px 24px}
.day-label-top{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.day-title{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#f0e8d8;margin-bottom:14px;line-height:1.3}
.tip-box{border-radius:10px;padding:11px 14px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.tip-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.tip-text{font-size:12px;color:#b8b0a0;line-height:1.65}

/* THEORY */
.section-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;color:#5a5468}
.theory-block{margin-bottom:7px;border-radius:10px;overflow:hidden;border:1px solid #2a2535;transition:border-color .2s}
.theory-block.open{border-color:rgba(255,255,255,.15)}
.theory-toggle{width:100%;background:rgba(255,255,255,.02);border:none;cursor:pointer;padding:11px 14px;text-align:left;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.theory-toggle:hover{background:rgba(255,255,255,.05)}
.theory-block.open .theory-toggle{background:rgba(255,255,255,.04)}
.theory-num{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:9px;font-weight:700}
.theory-toggle-left{display:flex;align-items:center;gap:9px}
.theory-toggle-title{font-size:12px;color:#d8d0c0;font-weight:600}
.theory-arrow{font-size:13px;transition:transform .25s;display:block}
.theory-block.open .theory-arrow{transform:rotate(180deg)}
.theory-body{padding:13px 14px 15px;border-top:1px solid rgba(255,255,255,.08);display:none}
.theory-block.open .theory-body{display:block}
.theory-content{font-size:12.5px;color:#9a9298;line-height:1.8}

/* TASKS */
.task-item{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;border-radius:8px;cursor:pointer;margin-bottom:5px;border:1px solid #2a2535;background:rgba(255,255,255,.02);transition:background .15s,border-color .2s}
.task-item:hover{background:rgba(255,255,255,.04)}
.task-item.done{border-color:rgba(255,255,255,.1)}
.task-check{width:17px;height:17px;border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;border:2px solid #4a4458;transition:all .2s;background:transparent}
.task-item.done .task-check{border-color:inherit}
.task-check-icon{font-size:9px;color:#000;display:none}
.task-item.done .task-check-icon{display:block}
.task-text{font-size:13px;color:#b8b0a0;line-height:1.5;transition:color .2s}
.task-item.done .task-text{color:#5a5258;text-decoration:line-through}

/* WEEK PROGRESS */
.week-prog-box{padding:13px;background:#1a1825;border-radius:10px;margin-bottom:14px}
.week-prog-label{font-size:10px;color:#4a4458;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.week-prog-bars{display:flex;gap:5px}
.week-prog-bar{flex:1;height:5px;border-radius:2px;cursor:pointer;transition:background .3s}

/* NAV */
.nav-row{display:flex;justify-content:space-between;margin-top:2px}
.btn-back{background:#1a1825;border:1px solid #2a2535;border-radius:8px;padding:8px 16px;color:#8a8298;cursor:pointer;font-size:13px;font-family:'Source Sans 3',sans-serif;transition:background .2s}
.btn-back:hover{background:#222030}
.btn-next{border:none;border-radius:8px;padding:8px 16px;color:#0f0e17;cursor:pointer;font-size:13px;font-family:'Source Sans 3',sans-serif;font-weight:600;transition:opacity .2s}
.btn-next:hover{opacity:.85}

/* STRATEGY TAB */
#strategy-tab{display:none;padding:20px 24px;overflow-y:auto;flex:1}
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;margin-bottom:20px}
.strat-card{background:#1a1825;border:1px solid #2a2535;border-radius:12px;padding:17px;transition:transform .25s,box-shadow .25s;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.strat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.strat-icon{font-size:24px;margin-bottom:9px}
.strat-title{font-family:'Playfair Display',serif;font-size:14px;color:#e8e0d0;margin-bottom:7px;font-weight:600}
.strat-body{font-size:12px;color:#7a7288;line-height:1.7}
.score-box{background:#1a1825;border:1px solid #2a2535;border-radius:12px;padding:18px}
.score-title{font-family:'Playfair Display',serif;font-size:16px;color:#f0e8d8;margin-bottom:12px}
.score-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
.score-item{border-radius:8px;padding:11px}
.score-pts{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:3px}
.score-desc{font-size:11px;color:#6a6258}

/* PLAN TAB */
#plan-tab{display:flex;flex:1;overflow:hidden}

/* FADE */
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media(max-width:600px){
  #sidebar{width:160px}
  #content{padding:16px}
}
</style>
</head>
<body>
<div id="app">

  <div id="header">
    <div class="header-label">Экспресс-подготовка</div>
    <div class="header-title playfair">ЕГЭ по обществознанию · <span>30 дней</span></div>
    <div class="progress-row">
      <div class="progress-bar-wrap">
        <div class="progress-labels"><span>Прогресс</span><strong id="pct">0%</strong></div>
        <div class="progress-track"><div class="progress-fill" id="pfill" style="width:0%"></div></div>
      </div>
      <span class="progress-count" id="pcnt">0/0 заданий</span>
    </div>
  </div>

  <div id="tabs">
    <button class="tab-btn active" onclick="switchTab('plan')">📅 План</button>
    <button class="tab-btn" onclick="switchTab('strategy')">🎯 Стратегии</button>
  </div>

  <div id="main-body">
    <div id="plan-tab">
      <div id="sidebar"></div>
      <div id="content" class="fade-in"></div>
    </div>
    <div id="strategy-tab"></div>
  </div>

</div>

<script>
const DATA = [
  {num:1,title:"Человек и общество + Экономика (основы)",color:"#c8a96e",days:[
    {day:"День 1",theme:"Природа человека. Потребности, деятельность, мышление",tasks:["Прочитать теорию и выписать ключевые определения","Составить схему структуры деятельности","Решить 10 тестовых заданий части 1 по теме"],tip:"Запомни структуру деятельности: субъект → цель → мотив → средства → результат",theory:[
      {title:"Человек как биосоциальное существо",content:"Человек — существо биологическое (имеет инстинкты, физиологические потребности, подчиняется законам природы) и социальное (живёт в обществе, усваивает культуру, формирует личность). Личность — это социальный облик человека, совокупность устойчивых черт, формируемых в процессе социализации. Индивид — отдельный представитель вида Homo sapiens. Индивидуальность — неповторимое своеобразие человека."},
      {title:"Потребности и их классификация",content:"Потребность — осознаваемая нужда человека в чём-либо. Классификация по Маслоу (пирамида): 1) физиологические (еда, сон), 2) безопасность, 3) социальные (общение, принадлежность), 4) престижные (уважение, статус), 5) духовные (саморазвитие, творчество). По происхождению: биологические (природные) и социальные (обусловлены обществом). По сферам: материальные и духовные."},
      {title:"Деятельность: структура и виды",content:"Деятельность — активное взаимодействие человека с миром, в ходе которого он достигает сознательно поставленных целей. Структура: субъект (кто действует) → мотив (почему) → цель (зачем) → средства (как) → действие → результат. Виды: игра (процесс важнее результата), учение (усвоение знаний), труд (создание благ), общение (обмен информацией). Отличие от поведения животных: осознанность, целеполагание, преобразование мира."},
      {title:"Мышление и сознание",content:"Мышление — высшая форма познавательной деятельности, позволяющая отражать существенные связи и отношения объектов. Формы мышления: понятие (мысль о существенных признаках), суждение (утверждение/отрицание чего-либо), умозаключение (вывод из суждений). Сознание — высшая форма отражения действительности, свойственная только человеку. Самосознание — осознание человеком себя как личности."}
    ]},
    {day:"День 2",theme:"Общество: типы, структура, развитие",tasks:["Изучить теорию и составить сравнительную таблицу трёх типов общества","Нарисовать схему подсистем общества","Отработать задание №18 (план к тексту)"],tip:"Чаще всего в ЕГЭ спрашивают признаки постиндустриального общества — выучи их наизусть",theory:[
      {title:"Общество: понятие и подсистемы",content:"Общество — обособившаяся от природы часть материального мира, представляющая собой исторически развивающуюся форму жизнедеятельности людей. Четыре подсистемы (сферы): экономическая (производство, распределение благ), социальная (классы, нации, семья), политическая (власть, государство, право), духовная (наука, культура, религия, образование). Каждая сфера взаимосвязана с другими."},
      {title:"Типы общества",content:"Традиционное (аграрное): основа — сельское хозяйство, ручной труд; ведущая роль — церковь и армия; сословный строй, медленные изменения. Индустриальное: основа — промышленность, машинный труд; урбанизация, классовая структура, светское государство. Постиндустриальное (информационное): основа — сфера услуг и информация; ключевой ресурс — знание; ведущая роль — наука и образование; гражданское общество."},
      {title:"Социальный прогресс и его критерии",content:"Прогресс — направление развития от низшего к высшему, от простого к сложному. Критерии: уровень производительности труда, степень свободы личности, уровень нравственности, развитие науки и техники. Реформа — постепенное преобразование «сверху», без разрушения основ. Революция — коренное быстрое изменение основ общественного устройства. Эволюция — постепенные медленные изменения."},
      {title:"Глобализация и глобальные проблемы",content:"Глобализация — процесс всемирной экономической, культурной и политической интеграции. Проявления: международное разделение труда, мировой рынок, интернет, транснациональные компании. Глобальные проблемы: угроза ядерной войны, экологический кризис, терроризм, демографическая проблема, разрыв между «Севером» и «Югом», энергетическая и продовольственная проблемы. Решение — только совместными усилиями всего человечества."}
    ]},
    {day:"День 3",theme:"Познание. Истина. Наука",tasks:["Изучить теорию по чувственному и рациональному познанию","Выписать критерии истины и виды знания","Решить 10 тестов по теме «Познание»"],tip:"Практика — основной критерий истины. Этот тезис встречается в эссе и части 2",theory:[
      {title:"Познание и его формы",content:"Познание — процесс отражения и воспроизведения действительности в мышлении. Чувственное познание: ощущение (отдельные свойства предмета), восприятие (целостный образ), представление (образ в памяти). Рациональное: понятие (существенные признаки), суждение (связь понятий), умозаключение (новое знание из суждений). Оба вида взаимосвязаны."},
      {title:"Истина и её критерии",content:"Истина — знание, соответствующее действительности. Абсолютная истина — полное, исчерпывающее знание, которое нельзя опровергнуть. Относительная истина — неполное, приблизительное знание, которое может быть уточнено. Критерии: практика (главный), логическая согласованность, соответствие законам науки. Заблуждение — непреднамеренное несоответствие знаний действительности. Ложь — намеренное искажение."},
      {title:"Наука как форма познания",content:"Признаки научного знания: системность, доказательность, объективность, воспроизводимость, теоретичность. Уровни: эмпирический (наблюдение, эксперимент, описание фактов) и теоретический (гипотеза, теория, закон). Методы: наблюдение, эксперимент, моделирование, анализ, синтез, индукция, дедукция. Функции науки: познавательная, объяснительная, прогностическая, социальная, производительная сила."},
      {title:"Другие формы познания",content:"Мифологическое — объяснение мира через мифы. Религиозное — основано на вере в сверхъестественное. Художественное — образное постижение мира через искусство. Обыденное — накапливается в повседневном опыте. Философское — осмысление всеобщих законов бытия. Народная мудрость — пословицы, обычаи, традиции."}
    ]},
    {day:"День 4",theme:"Духовная сфера: культура, образование, религия",tasks:["Конспект по теме «Формы и виды культуры»","Разобрать функции образования в обществе","Решить задания №1–6 из пробного варианта"],tip:"Отличай массовую, элитарную и народную культуру — это классическое задание",theory:[
      {title:"Культура: понятие и формы",content:"Культура (в широком смысле) — всё созданное человеком. Материальная: здания, техника, предметы быта. Духовная: наука, искусство, мораль, религия. Формы культуры: элитарная (высокая) — создаётся профессионалами для узкого круга; народная — анонимная; массовая — общедоступная, коммерческая, тиражируемая. Субкультура — культура части общества. Контркультура — противостоит господствующей."},
      {title:"Искусство и мораль",content:"Искусство — образное осмысление действительности. Функции: эстетическая, познавательная, воспитательная, компенсаторная (отдых), коммуникативная, социализирующая. Мораль — система норм, принципов и ценностей, регулирующих поведение. Особенности морали: не закреплена официально, поддерживается силой общественного мнения, санкции — одобрение или осуждение. Категории морали: добро и зло, долг, совесть, честь, справедливость."},
      {title:"Образование и его функции",content:"Образование — целенаправленный процесс воспитания и обучения. Принципы в РФ: гуманизм, светскость, общедоступность, бесплатность базового уровня. Уровни: дошкольное, начальное, основное, среднее, СПО, высшее. Функции: передача знаний, социализация, социальный лифт, подготовка к труду, формирование гражданственности, культурная трансляция."},
      {title:"Религия и её роль",content:"Религия — мировоззрение, основанное на вере в сверхъестественное. Мировые религии: христианство (~2,4 млрд), ислам (~1,9 млрд), буддизм (~500 млн). Функции: мировоззренческая, утешительная (компенсаторная), регулятивная, объединяющая, культурная. Свобода совести — право исповедовать любую религию. РФ — светское государство (ст. 14 Конституции РФ)."}
    ]},
    {day:"День 5",theme:"Экономика: основные понятия и факторы производства",tasks:["Изучить факторы производства и их доходы","Разобрать виды экономических систем","Составить глоссарий по экономике (20+ терминов)"],tip:"В части 2 экономика — одна из самых частых тем. Начни копить термины уже сейчас",theory:[
      {title:"Экономика: предмет и функции",content:"Экономика — наука о том, как общество использует ограниченные ресурсы. Главный вопрос: что, как и для кого производить? Потребности безграничны, ресурсы ограничены — основное противоречие. Блага: свободные (воздух) и экономические (созданные трудом). Товар — продукт труда для обмена. Услуга — деятельность, результат которой потребляется в процессе её оказания."},
      {title:"Факторы производства и их доходы",content:"Земля (природные ресурсы) → доход: рента. Труд (физические и умственные способности) → доход: заработная плата. Капитал: физический (станки, здания) и человеческий (знания, навыки) → доход: процент. Предпринимательство (организация, инновации, риск) → доход: прибыль. Информация — 5-й фактор в современной экономике."},
      {title:"Типы экономических систем",content:"Традиционная: решения на основе традиций, низкий уровень развития. Командная (плановая): государство централизованно решает «что, как и для кого», нет конкуренции. Рыночная: решения принимает рынок через ценовой механизм, частная собственность, конкуренция. Смешанная: сочетание рынка и государственного регулирования. Ни одна система в чистом виде не существует."},
      {title:"Собственность и её формы",content:"Собственность — отношения по поводу принадлежности имущества. Права собственника: владение, пользование, распоряжение. Формы: частная (физических и юридических лиц), государственная (федеральная и региональная), муниципальная. Приватизация — передача государственной собственности в частные руки. Национализация — обратный процесс. В РФ признаются все формы (ст. 8 Конституции РФ)."}
    ]},
    {day:"День 6",theme:"Рынок: спрос, предложение, равновесие",tasks:["Изучить законы спроса и предложения","Нарисовать и разобрать графики рыночного равновесия","Решить 15 тестов части 1 по экономике"],tip:"Уметь читать и объяснять график спрос/предложение — обязательный навык",theory:[
      {title:"Спрос и его детерминанты",content:"Спрос — желание и способность покупателей приобрести товар по определённой цене. Закон спроса: чем выше цена — тем меньше величина спроса (обратная зависимость). Неценовые факторы: доходы потребителей, цены на субституты и комплементы, вкусы и предпочтения, число покупателей, ожидания. Нормальные товары (спрос растёт с доходом) vs товары Гиффена (спрос растёт при росте цены)."},
      {title:"Предложение и его детерминанты",content:"Предложение — желание и способность производителей продать товар. Закон предложения: чем выше цена — тем больше величина предложения (прямая зависимость). Неценовые факторы: цены на ресурсы, технологии, налоги и субсидии, число производителей, цены на другие товары, ожидания производителей."},
      {title:"Рыночное равновесие и цены",content:"Равновесная цена — при которой спрос равен предложению. При цене выше равновесной → избыток товара. При цене ниже → дефицит. Функции цены: информационная, стимулирующая, распределительная. Государственное регулирование: «потолок» цены (максимум → дефицит), «пол» цены (минимум → избыток)."},
      {title:"Виды рынков",content:"По объекту: товаров и услуг, труда, капитала, земли, финансовый. По географии: местный, национальный, мировой. По конкуренции: совершенная конкуренция, монополистическая конкуренция, олигополия (несколько крупных игроков), монополия (один продавец). Монополия диктует цены — государство регулирует антимонопольным законодательством."}
    ]},
    {day:"День 7",theme:"Повторение + мини-тест",tasks:["Повторить всё пройденное за неделю по карточкам","Написать развёрнутый план по теме «Рыночная экономика»","Решить полный пробный вариант части 1 (задания 1–16)"],tip:"Засеки время: на часть 1 у тебя должно уходить не более 60 минут",theory:[
      {title:"Ключевые термины: Человек и общество",content:"Личность, индивид, индивидуальность, социализация, деятельность, потребность, мотив, цель. Истина (абсолютная/относительная), практика, наука, культура (массовая/элитарная/народная), субкультура, контркультура. Общество (традиционное/индустриальное/постиндустриальное), прогресс, реформа, революция, глобализация."},
      {title:"Ключевые термины: Экономика",content:"Факторы производства: земля (рента), труд (зарплата), капитал (процент), предпринимательство (прибыль). Спрос, предложение, равновесная цена, дефицит, избыток. Субституты и комплементы. Типы систем: традиционная, командная, рыночная, смешанная. Собственность (частная, государственная, муниципальная)."},
      {title:"Типичные ошибки в заданиях части 1",content:"Задания на «лишнее»: внимательно читай, к какому понятию относится каждый пункт. Задания на соответствие: проверяй каждую пару, не угадывай. Задания с графиком: определи сначала, что смещается (спрос или предложение), затем — в какую сторону. Задания на признаки: 1–2 лишних признака специально добавлены, чтобы запутать."},
      {title:"Как составить развёрнутый план",content:"Структура плана: 1. Понятие и сущность явления. 2. Признаки/черты/характеристики. 3. Виды/формы/типы. 4. Функции/роль. 5. Проблемы и тенденции. Требования ЕГЭ: минимум 3 пункта, в каждом — 2–3 подпункта. Пример «Рыночная экономика»: 1) Сущность рынка. 2) Субъекты (домохозяйства, фирмы, государство). 3) Механизм ценообразования. 4) Конкуренция. 5) Роль государства."}
    ]}
  ]},
  {num:2,title:"Экономика (углублённо) + Социальные отношения",color:"#7eb8a4",days:[
    {day:"День 8",theme:"Фирма: издержки, прибыль, конкуренция",tasks:["Изучить виды издержек и формулы расчёта","Разобрать типы рыночных структур","Решить задачи на расчёт прибыли и рентабельности"],tip:"Задача на расчёт — это лёгкие баллы. Отработай формулу: прибыль = выручка − издержки",theory:[
      {title:"Издержки производства",content:"Постоянные (FC) — не зависят от объёма (аренда, оклады). Переменные (VC) — зависят от объёма (сырьё, сдельная зарплата). Общие (TC) = FC + VC. Средние (AC) = TC / Q. Предельные (MC) — прирост затрат на единицу. Бухгалтерские — фактические денежные расходы. Экономические — включают альтернативные (вменённые) издержки."},
      {title:"Выручка и прибыль",content:"Выручка (TR) = цена × количество (P × Q). Бухгалтерская прибыль = TR − бухгалтерские издержки. Экономическая прибыль = TR − экономические издержки. Рентабельность = (прибыль / выручка) × 100%. Точка безубыточности — объём, при котором TR = TC. Пример: выручка 500 000 руб., издержки 380 000 руб. → прибыль 120 000 руб., рентабельность 24%."},
      {title:"Конкуренция и рыночные структуры",content:"Совершенная конкуренция: много продавцов, однородный товар, свободный вход, цена задаётся рынком. Монополистическая: много продавцов, дифференцированный товар (реклама, бренд). Олигополия: 2–10 крупных игроков, взаимозависимость решений, барьеры входа. Монополия: 1 продавец, диктует цену. Антимонопольная политика: запрет картелей, контроль слияний, ФАС в РФ."},
      {title:"Предпринимательство и организационные формы",content:"Предпринимательство — самостоятельная деятельность с целью прибыли, на свой риск. Формы: ИП (индивидуальный предприниматель), ООО (ограниченная ответственность), АО (ПАО и НАО). Ответственность: ИП — всем имуществом; ООО и АО — в пределах вклада. Акция — ценная бумага, удостоверяющая долю в АО. Дивиденды — доход по акциям. Облигация — долговая ценная бумага."}
    ]},
    {day:"День 9",theme:"Государство и экономика: бюджет, налоги, ВВП",tasks:["Изучить виды налогов и функции налоговой системы","Разобрать понятие ВВП и способы его измерения","Составить схему доходов и расходов бюджета"],tip:"Прямые налоги (НДФЛ, налог на прибыль) vs косвенные (НДС, акцизы) — постоянная тема",theory:[
      {title:"Налоги и налоговая система",content:"Налог — обязательный, безвозмездный платёж в бюджет. Прямые: взимаются с дохода или имущества (НДФЛ 13%, налог на прибыль 20%, налог на имущество). Косвенные: включаются в цену товара (НДС 20%, акцизы, таможенные пошлины). По ставке: пропорциональные, прогрессивные, регрессивные. Функции: фискальная, регулирующая, распределительная, контрольная."},
      {title:"Государственный бюджет",content:"Бюджет — роспись доходов и расходов государства. Доходы: налоговые (80–90%) и неналоговые (доходы от госсобственности, штрафы). Расходы: социальные (пенсии, здравоохранение, образование), оборона, госуправление, национальная экономика. Профицит — доходы > расходов. Дефицит — расходы > доходов. Государственный долг — накопленный дефицит."},
      {title:"ВВП и макроэкономические показатели",content:"ВВП — рыночная стоимость всех конечных товаров и услуг, произведённых в стране за год. Методы расчёта: по расходам (C + I + G + NX), по доходам, по добавленной стоимости. ВВП номинальный — в текущих ценах. ВВП реальный — скорректированный на инфляцию. ВВП на душу населения = ВВП / численность населения."},
      {title:"Фискальная и монетарная политика",content:"Фискальная — регулирование через налоги и расходы. Стимулирующая: снижение налогов + рост расходов (при спаде). Сдерживающая: рост налогов + снижение расходов (при перегреве). Монетарная — регулирование денежной массы ЦБ. Инструменты: ключевая ставка, операции на открытом рынке, нормы резервов. Повышение ставки → кредиты дороже → спрос падает → инфляция снижается."}
    ]},
    {day:"День 10",theme:"Деньги, банки, инфляция",tasks:["Изучить функции денег и банковскую систему","Разобрать причины и виды инфляции","Составить конспект о роли Центрального банка"],tip:"Инфляция спроса и инфляция издержек — обязательно различай в части 2",theory:[
      {title:"Деньги и их функции",content:"Деньги — всеобщий эквивалент, посредник в обмене. Функции: мера стоимости, средство обращения, средство накопления, средство платежа, мировые деньги. Эволюция: товарные → металлические → бумажные → безналичные → электронные. Денежная масса: М0 — наличные, М1 — М0 + вклады до востребования, М2 — М1 + срочные вклады."},
      {title:"Банковская система",content:"Двухуровневая: ЦБ (Банк России) + коммерческие банки. ЦБ: эмиссия денег, хранение резервов, регулирование банков, кредитор последней инстанции, монетарная политика. Коммерческие: привлечение депозитов, выдача кредитов, расчётно-кассовое обслуживание. Маржа банка = ставка по кредиту − ставка по депозиту. Обязательные резервы — часть депозитов в ЦБ."},
      {title:"Инфляция",content:"Инфляция — устойчивый рост общего уровня цен (обесценивание денег). Виды по темпу: умеренная (до 10%/год), галопирующая (10–200%), гиперинфляция (>200%). Инфляция спроса — избыточный спрос («много денег гонятся за малым количеством товаров»). Инфляция издержек — рост себестоимости (зарплаты, сырьё) → рост цен. Последствия: снижение реальных доходов, обесценивание сбережений."},
      {title:"Рынок труда и занятость",content:"Спрос — работодатели, предложение — работники, цена — зарплата. Безработица — люди ищут работу, но не могут найти. Виды: фрикционная (смена работы), структурная (несоответствие навыков), циклическая (спад производства). Естественный уровень = фрикционная + структурная (3–5%). МРОТ гарантирован государством. Закон Оукена: рост безработицы на 1% → снижение ВВП на ~2%."}
    ]},
    {day:"День 11",theme:"Социальная структура: стратификация и мобильность",tasks:["Изучить теории социальной стратификации","Разобрать виды социальной мобильности","Решить задания №17–20 из пробного варианта"],tip:"Каналы социальной мобильности (армия, церковь, образование, брак) — классика ЕГЭ",theory:[
      {title:"Социальная стратификация",content:"Стратификация — разделение общества на слои (страты). Критерии по Веберу: доход, власть, престиж. По Марксу — классы определяются отношением к собственности. Страты: высший класс, средний класс (основа стабильности), низший класс. Исторические типы: рабство, каста, сословие, класс."},
      {title:"Социальная мобильность",content:"Мобильность — перемещение по социальной лестнице. Вертикальная: восходящая (повышение статуса) и нисходящая (понижение). Горизонтальная — без изменения статуса (смена профессии, города). Индивидуальная — один человек. Групповая — целая группа. Каналы (лифты) по Сорокину: образование, армия, церковь, брак, партии, профессиональные организации."},
      {title:"Социальные группы и их виды",content:"Социальная группа — совокупность людей, объединённых общими признаками. Большие: классы, нации, профессиональные группы. Малые: семья, трудовой коллектив, группа друзей. Первичные — непосредственное, тесное взаимодействие (семья). Вторичные — формализованные отношения (партия, профсоюз). Маргинальность — пограничное положение между группами."},
      {title:"Семья как социальный институт",content:"Семья — малая группа, основанная на браке или кровном родстве. Функции: репродуктивная, воспитательная, хозяйственно-экономическая, социально-статусная, эмоционально-психологическая. Типы: нуклеарная (родители + дети), расширенная (+ бабушки, дедушки). По власти: патриархальная, матриархальная, эгалитарная. Тенденции: снижение рождаемости, рост разводов, нуклеаризация."}
    ]},
    {day:"День 12",theme:"Нации, этносы, межнациональные отношения",tasks:["Изучить понятия: нация, народность, этнос","Разобрать виды межнациональных конфликтов и пути решения","Написать развёрнутый ответ на задание о национальной политике"],tip:"Толерантность, мультикультурализм, ассимиляция — ключевые слова для заданий этой темы",theory:[
      {title:"Этнос, народность, нация",content:"Этнос — исторически сложившаяся устойчивая общность, объединённая языком, культурой, самосознанием. Племя → народность → нация (высший тип, связан с государством). Нация: общая территория, язык, экономические связи, культура, самосознание. Национализм — идеология превосходства своей нации (умеренный vs экстремистский)."},
      {title:"Межнациональные отношения",content:"Формы: сотрудничество (интеграция), этнический конфликт, ассимиляция (поглощение меньшинства), сегрегация (принудительное разделение), геноцид. Причины конфликтов: борьба за ресурсы, исторические обиды, религиозные противоречия, неравенство в правах. Пути урегулирования: переговоры, автономия, культурные права, международное посредничество."},
      {title:"Национальная политика и принципы",content:"Национальная политика — деятельность государства в сфере межнациональных отношений. Принципы демократической политики: равноправие народов, право на самоопределение, уважение прав меньшинств, культурная автономия. Мультикультурализм — признание ценности культурного разнообразия. Толерантность — терпимость к иным культурам. РФ — многонациональное государство (190+ народов)."},
      {title:"Социальные конфликты",content:"Конфликт — столкновение противоположных интересов, ценностей, взглядов. Структура: стороны, объект, предмет, повод, причина. Стадии: предконфликтная → инцидент → эскалация → урегулирование → постконфликт. Стратегии: соперничество, сотрудничество, компромисс, уклонение, приспособление. Методы урегулирования: переговоры, медиация, арбитраж."}
    ]},
    {day:"День 13",theme:"Социальные нормы, девиантное поведение, контроль",tasks:["Изучить виды социальных норм и санкций","Разобрать теории девиантного поведения","Решить 10 тестов по социальной сфере"],tip:"Формальный/неформальный контроль и позитивные/негативные санкции — частая пара вопросов",theory:[
      {title:"Социальные нормы",content:"Социальная норма — правило поведения, принятое в обществе. Виды: обычаи и традиции, моральные нормы (добро/зло), правовые (закреплены государством), религиозные, эстетические, корпоративные (внутри организации). Особенности правовой нормы: формальная определённость, государственная охрана, обязательность для всех."},
      {title:"Социальный контроль",content:"Социальный контроль — механизм поддержания порядка. Методы: внутренний (самоконтроль — совесть) и внешний (реакция других). Внешний: формальный (государство, законы) и неформальный (мнение окружающих). Санкции: позитивные (поощрение — премия, похвала) и негативные (наказание — штраф, осуждение); формальные и неформальные."},
      {title:"Девиантное и делинквентное поведение",content:"Девиантное — отклонение от социальных норм (позитивное: героизм, гений; негативное: преступность, алкоголизм). Делинквентное — противоправное поведение (нарушение правовых норм). Причины: биологические (Ломброзо), психологические, социальные (Мертон: аномия — рассогласование целей и средств; стигматизация — ярлык преступника). Профилактика: социализация, занятость, поддержка семьи."},
      {title:"Молодёжь как социальная группа",content:"Молодёжь — социально-демографическая группа (14–30 лет). Особенности: переходное положение, поиск идентичности, высокая мобильность, восприимчивость к новому. Молодёжные субкультуры — особые ценности, стиль, поведение. Проблемы: безработица, наркотики, экстремизм. Молодёжная политика: образование, занятость, жильё, здоровье, культура."}
    ]},
    {day:"День 14",theme:"Повторение + пробное сочинение (эссе)",tasks:["Повторить экономику и социологию по конспектам","Написать мини-эссе на 1 из предложенных тезисов","Проверить эссе по критериям ЕГЭ (К1–К3)"],tip:"Структура эссе: тезис → аргумент 1 (с примером) → аргумент 2 (с примером) → вывод",theory:[
      {title:"Как писать эссе — подробный алгоритм",content:"Шаг 1: Выбери тему, в которой уверен. Шаг 2: Объясни смысл высказывания (своими словами, не дублируй цитату). Шаг 3: Сформулируй тезис — согласен/не согласен/частично. Шаг 4: Аргумент 1 — теоретический (понятия, законы, концепции). Шаг 5: Пример 1 — конкретный (история, факт, статистика). Шаг 6: Аргумент 2 + Пример 2. Шаг 7: Вывод — подтверди тезис. Объём: 150–250 слов."},
      {title:"Критерии оценки эссе",content:"К1 (2 балла): раскрытие смысла высказывания — правильно ли понята идея. К2 (2 балла): качество аргументации — теоретические понятия и корректные примеры. К3 (1 балл): проявление авторской позиции. Итого: максимум 6 баллов. Ошибки: пересказ темы; расплывчатые примеры («один человек однажды...»); аргументы без примеров; отклонение от темы."},
      {title:"Ключевые термины: социальная сфера",content:"Стратификация, страта, мобильность (вертикальная/горизонтальная), каналы мобильности, маргинальность. Этнос, нация, народность, толерантность, ассимиляция. Норма, санкция (позитивная/негативная, формальная/неформальная), контроль. Девиация, делинквентность, аномия. Семья (нуклеарная/расширенная), функции семьи."},
      {title:"Ключевые термины: экономика",content:"Издержки (FC, VC, TC), прибыль, рентабельность. Налоги (прямые/косвенные), бюджет (профицит/дефицит), ВВП (номинальный/реальный). Деньги, инфляция (спроса/издержек), банковская система, ключевая ставка. Рынок труда, безработица (фрикционная/структурная/циклическая), МРОТ. Конкуренция, монополия, олигополия."}
    ]}
  ]},
  {num:3,title:"Политика + Право (основы)",color:"#a07eb8",days:[
    {day:"День 15",theme:"Власть, политическая система, государство",tasks:["Изучить признаки и функции государства","Разобрать формы правления и государственного устройства","Составить схему политической системы общества"],tip:"Форма правления + форма устройства + политический режим = полная характеристика государства",theory:[
      {title:"Власть и её виды",content:"Власть — способность субъекта влиять на поведение других. Виды: политическая, экономическая, духовная, военная, семейная. Источники: сила, авторитет, закон, богатство, знание. Легитимность по Веберу: традиционная (обычай), харизматическая (личные качества), легальная (рационально-правовая). Легитимность ≠ легальность (законность)."},
      {title:"Государство: признаки и функции",content:"Признаки: территория, население, суверенитет, публичная власть, правовая система, монополия на законное принуждение, налоги. Внутренние функции: охрана порядка, экономическая, социальная, культурная. Внешние: оборона, дипломатия, участие в международных организациях. Государство — главный институт политической системы."},
      {title:"Формы государства",content:"Форма правления: монархия (абсолютная — вся власть у монарха; конституционная: дуалистическая и парламентская) и республика (президентская, парламентская, смешанная/полупрезидентская — РФ и Франция). Форма устройства: унитарное (единый центр), федерация (субъекты имеют собственные полномочия), конфедерация (союз суверенных государств)."},
      {title:"Политическая система общества",content:"Совокупность государственных и негосударственных институтов, осуществляющих политическую власть. Элементы: институциональная подсистема (государство, партии, НКО), нормативная (конституция, законы), коммуникативная (взаимодействие субъектов), культурная (ценности, идеологии), функциональная (методы осуществления власти)."}
    ]},
    {day:"День 16",theme:"Демократия: принципы, институты, типы",tasks:["Изучить принципы и ценности демократии","Разобрать прямую и представительную демократию","Решить 10 тестов по политическим институтам"],tip:"Парламентская vs президентская республика — один из самых частых вопросов темы",theory:[
      {title:"Демократия: понятие и принципы",content:"Демократия — форма правления, при которой власть принадлежит народу. Принципы: народный суверенитет, выборность органов власти, принцип большинства при уважении прав меньшинства, разделение властей, верховенство закона, гарантии прав и свобод, политический плюрализм, свобода СМИ. Права меньшинства защищены конституцией."},
      {title:"Прямая и представительная демократия",content:"Прямая — граждане сами принимают решения (референдум, народная инициатива). Плюсы: непосредственное волеизъявление. Минусы: сложно в большом государстве. Представительная — граждане избирают представителей. Плюсы: профессионализм. Минусы: отрыв от народа. Референдум в РФ — на федеральном, региональном и местном уровнях."},
      {title:"Гражданское общество и правовое государство",content:"Гражданское общество — сфера самоорганизации граждан независимо от государства (НКО, профсоюзы, СМИ, церковь). Правовое государство: верховенство права, разделение властей, гарантии прав и свобод, взаимная ответственность государства и гражданина. Социальное государство — берёт обязательства по обеспечению достойного уровня жизни. РФ по Конституции — демократическое федеративное правовое социальное государство."},
      {title:"Политические режимы",content:"Демократический — народовластие, права и свободы, многопартийность, разделение властей. Авторитарный — власть в одних руках, ограничение политических прав, нет массовых репрессий. Тоталитарный — полный контроль над всеми сферами, единственная партия, культ личности, массовые репрессии (нацистская Германия, СССР при Сталине). Критерий: объём политических свобод."}
    ]},
    {day:"День 17",theme:"Выборы и избирательные системы",tasks:["Изучить типы избирательных систем","Разобрать принципы избирательного права в РФ","Написать план «Избирательный процесс в демократическом обществе»"],tip:"Активное (с 18 лет) и пассивное (по-разному для разных должностей) избирательное право — запомни цифры",theory:[
      {title:"Избирательное право",content:"Активное — право избирать (в РФ с 18 лет). Пассивное — право быть избранным: депутат ГД — с 21 года, глава региона — с 30 лет, Президент РФ — с 35 лет (проживание в РФ не менее 25 лет). Принципы: всеобщность, равенство, прямые выборы, тайное голосование, добровольность. Лишены права: недееспособные и осуждённые, отбывающие наказание."},
      {title:"Избирательные системы",content:"Мажоритарная: побеждает набравший большинство. Относительное большинство — достаточно опередить конкурентов (Великобритания). Абсолютное — >50%+1 голос, часто 2 тура. Плюсы: связь с округом. Минусы: голоса «против» пропадают. Пропорциональная: мандаты пропорционально голосам за партии. Плюсы: представительность. Смешанная: часть по мажоритарной, часть по пропорциональной (ГД РФ: 225+225)."},
      {title:"Избирательный процесс в РФ",content:"Стадии: назначение выборов → регистрация кандидатов/партий → агитация → голосование → подсчёт → признание итогов → вступление в должность. Президент РФ: раз в 6 лет, абсолютное большинство (2-й тур возможен), не более 2 сроков подряд. ГД: раз в 5 лет, смешанная система, барьер для партий — 5%. ЦИК организует федеральные выборы."},
      {title:"Политическое участие граждан",content:"Формы участия: выборы и референдумы, партии и НКО, обращения к властям, митинги и демонстрации (законные), гражданское неповиновение. Абсентеизм — уклонение от выборов (признак недоверия к власти). Политическая культура: патриципаторная (активная), подданническая (выполнение обязанностей), провинциальная (аполитичность) — типы по Алмонду и Вербе."}
    ]},
    {day:"День 18",theme:"Политические партии и идеологии",tasks:["Изучить функции политических партий","Разобрать основные идеологии","Составить сравнительную таблицу идеологий"],tip:"Вопросы о функциях партий встречаются в части 2. Функции: политическая социализация, агрегирование интересов и др.",theory:[
      {title:"Политические партии",content:"Партия — организованная группа единомышленников, стремящаяся к власти. Признаки: организованность, идеология, стремление к власти, поддержка граждан. Функции: политическая социализация, агрегирование интересов, выдвижение кандидатов, разработка программ, формирование правительства, коммуникация. Виды: парламентские/непарламентские, правящие/оппозиционные, массовые/кадровые."},
      {title:"Партийные системы",content:"Однопартийная — одна партия монополизирует власть (тоталитарные режимы). Двухпартийная — две основные партии сменяют друг друга (США, Великобритания). Многопартийная — несколько партий борются за власть, коалиции (большинство демократий). В РФ: многопартийная система с доминирующей «Единой Россией». Партии в РФ не вправе создавать вооружённые формирования."},
      {title:"Основные политические идеологии",content:"Либерализм: приоритет свободы личности, ограниченное государство, рыночная экономика, права человека. Консерватизм: сохранение традиций, стабильность, постепенные реформы, сильное государство. Социализм: равенство, социальная справедливость, перераспределение богатства, активная роль государства. Коммунизм: общественная собственность, отсутствие классов. Фашизм: национализм, тоталитаризм, культ государства — признан преступной идеологией."},
      {title:"СМИ и политика",content:"СМИ — пресса, ТВ, радио, интернет-медиа. Роль в политике: информирование граждан, формирование общественного мнения, политическая социализация, контроль над властью («четвёртая власть»). Функции: информационная, аналитическая, развлекательная, мобилизационная. Пропаганда — целенаправленное формирование нужных взглядов. В демократиях свобода прессы гарантирована."}
    ]},
    {day:"День 19",theme:"Право: понятие, система, источники",tasks:["Изучить признаки права и систему права","Разобрать иерархию нормативно-правовых актов","Составить схему источников права в РФ"],tip:"Нормативно-правовой акт → закон → подзаконный акт — иерархию источников права обязательно знать",theory:[
      {title:"Право: понятие и признаки",content:"Право — система общеобязательных норм, установленных государством и охраняемых его принуждением. Признаки: нормативность, общеобязательность, формальная определённость (закреплено письменно), системность, государственное обеспечение. Отличие от морали: право закреплено официально, охраняется государством; мораль — общественным мнением."},
      {title:"Система права",content:"Норма права — первичный элемент: гипотеза (условие) + диспозиция (правило поведения) + санкция (последствие нарушения). Институт права — совокупность норм по одному вопросу (институт собственности). Отрасль права — совокупность норм по одной сфере (гражданское, уголовное, трудовое). Частное право (гражданское, семейное) vs публичное (конституционное, административное, уголовное)."},
      {title:"Источники права и их иерархия",content:"Источники: нормативно-правовой акт (НПА), правовой прецедент (англосаксонское право), правовой обычай, международный договор. Иерархия НПА в РФ: Конституция РФ → ФКЗ → ФЗ (кодексы) → нормативные указы Президента → постановления Правительства → нормативные акты министерств → законы субъектов РФ → муниципальные НПА."},
      {title:"Правоотношения и правонарушения",content:"Правоотношение — общественное отношение, урегулированное нормой права. Элементы: субъекты (участники), объект (благо), содержание (права и обязанности). Правонарушение — виновное, противоправное деяние. Виды: проступки (дисциплинарные, административные, гражданские) и преступление (уголовно наказуемое). Юридическая ответственность: уголовная, административная, гражданско-правовая, дисциплинарная."}
    ]},
    {day:"День 20",theme:"Конституционное право РФ",tasks:["Изучить основы конституционного строя (главы 1–2 Конституции)","Разобрать права и обязанности гражданина РФ","Решить 10 тестов по конституционному праву"],tip:"Конституция РФ 1993 года — первоисточник. Прочти главы 1 и 2 полностью хотя бы раз",theory:[
      {title:"Основы конституционного строя РФ",content:"Конституция РФ принята 12 декабря 1993 года — основной закон государства. Характеристики РФ (ст. 1): демократическое, федеративное, правовое, с республиканской формой правления. Дополнительно: социальное (ст. 7), светское (ст. 14). Основы строя: народовластие, федерализм, разделение властей, местное самоуправление, политический плюрализм, многообразие форм собственности, приоритет прав человека."},
      {title:"Права и свободы граждан РФ",content:"Личные (гражданские): право на жизнь, достоинство, свободу, тайну переписки, неприкосновенность жилища. Политические: избирать и быть избранным, создавать партии, проводить митинги, обращаться в органы власти. Социально-экономические: труд, отдых, соцобеспечение, охрана здоровья, образование, жилище. Культурные: свобода творчества, доступ к культурным ценностям. Права неотчуждаемы, гарантированы, ограничены только законом."},
      {title:"Обязанности гражданина РФ",content:"Конституционные обязанности: платить налоги и сборы (ст. 57), сохранять природу (ст. 58), защищать Отечество (ст. 59), соблюдать Конституцию и законы (ст. 15), уважать права других (ст. 17), обеспечить детям основное общее образование — для родителей (ст. 43), заботиться о памятниках (ст. 44). За неисполнение предусмотрена ответственность."},
      {title:"Система государственных органов РФ",content:"Разделение властей: законодательная — Федеральное Собрание (Совет Федерации + Государственная Дума); исполнительная — Правительство РФ (Председатель); судебная — Конституционный суд, Верховный суд. Президент — глава государства, гарант Конституции. Прокуратура — надзор за законами. Счётная палата — контроль бюджета. ЦИК — организация выборов. Омбудсмен — Уполномоченный по правам человека."}
    ]},
    {day:"День 21",theme:"Повторение политики и права + пробные задания",tasks:["Повторить всё по политике и праву по конспектам","Решить задания №21–25 из пробного варианта","Составить 5 вопросов к тексту про демократию"],tip:"В заданиях 21–24 ответ должен содержаться в тексте. Не придумывай — цитируй и перефразируй",theory:[
      {title:"Алгоритм работы с текстом (задания 17–20)",content:"Шаг 1: Прочитай вопросы, затем текст. Шаг 2: Подчеркни ключевые фрагменты. Задание 17 — найди позицию автора (цитируй). Задание 18 — составь план (смотри на структуру абзацев). Задание 19 — приведи примеры (часть из текста, часть из курса). Задание 20 — используй знания курса, текст — только контекст. Не придумывай несуществующих фактов."},
      {title:"Ключевые термины: политика",content:"Власть, легитимность (традиционная/харизматическая/легальная), государство (признаки), суверенитет. Форма правления, форма устройства, политический режим (демократия/авторитаризм/тоталитаризм). Партия (функции), избирательная система, активное/пассивное избирательное право. Референдум, гражданское общество, правовое государство."},
      {title:"Ключевые термины: право",content:"Норма права (гипотеза/диспозиция/санкция), отрасль права, правоотношение, правонарушение (проступок/преступление). Юридическая ответственность (уголовная/административная/гражданская/дисциплинарная). Иерархия НПА: Конституция → ФКЗ → ФЗ → указы → постановления. Права граждан (личные, политические, социально-экономические). Обязанности граждан."},
      {title:"Органы государственной власти РФ — шпаргалка",content:"Президент: глава государства, Верховный главнокомандующий, гарант Конституции, избирается на 6 лет. ГД: 450 депутатов, 5 лет, принимает законы. СФ: 170+ сенаторов, одобряет законы, назначает судей. Правительство: исполняет законы, формирует бюджет. КС РФ: конституционный контроль. ВС РФ: высший суд по гражданским, уголовным, административным делам."}

  {num:4,title:"Право (углублённо) + Итоговое повторение",color:"#e07878",days:[
    {day:"День 22",theme:"Гражданское право: сделки, собственность, обязательства",tasks:["Изучить виды сделок и условия их действительности","Разобрать формы собственности и основания возникновения","Решить задачи по гражданскому праву"],tip:"Гражданская правоспособность — с рождения, дееспособность полная — с 18 лет. Исключения знай!",theory:[
      {title:"Гражданское право и субъекты",content:"Гражданское право — отрасль частного права, регулирующая имущественные и личные неимущественные отношения. Субъекты: физические лица, юридические лица, государство и муниципальные образования. Правоспособность — с рождения до смерти. Дееспособность: полная с 18 лет; эмансипация (с 16, если работает по ТД или женат/замужем); малолетние (до 14) — сделки за них совершают родители; несовершеннолетние (14–18) — с согласия родителей."},
      {title:"Сделки и договоры",content:"Сделка — действие, направленное на установление, изменение или прекращение гражданских прав. Виды: односторонние (завещание), двусторонние (договор). Условия действительности: законность, дееспособность сторон, добровольность (нет обмана, угрозы), соблюдение формы. Ничтожная сделка — недействительна с момента совершения (нарушает закон). Оспоримая — может быть признана недействительной судом."},
      {title:"Право собственности",content:"Правомочия: владение (фактическое обладание), пользование (извлечение пользы), распоряжение (определение судьбы). Основания возникновения: купля-продажа, дарение, наследование, создание вещи, приватизация. Прекращение: отчуждение, уничтожение, конфискация (за правонарушение), реквизиция (в ЧС с компенсацией). Общая собственность: совместная (доли не определены) и долевая."},
      {title:"Обязательства и ответственность",content:"Обязательство — правоотношение, в котором должник обязан совершить действия в пользу кредитора. Основания возникновения: договор, причинение вреда, неосновательное обогащение. Способы обеспечения: неустойка, залог, поручительство, банковская гарантия. Гражданско-правовая ответственность: возмещение убытков, уплата неустойки. Исковая давность (общий срок) — 3 года."}
    ]},
    {day:"День 23",theme:"Семейное и трудовое право",tasks:["Изучить условия заключения/расторжения брака","Разобрать права работника: МРОТ, отпуск, увольнение","Написать план «Трудовые правоотношения»"],tip:"Брачный договор, алименты, режим имущества супругов — типичные задачи ЕГЭ по семейному праву",theory:[
      {title:"Семейное право: брак",content:"Брак — добровольный союз мужчины и женщины, зарегистрированный в ЗАГСе. Условия: взаимное согласие, брачный возраст (18 лет, в исключительных — с 16), отсутствие препятствий. Препятствия: другой брак, близкое родство, недееспособность. Расторжение: в ЗАГСе (нет детей, общее согласие) или в суде. Признание недействительным — если нарушены условия заключения (с момента заключения)."},
      {title:"Семейное право: имущество и алименты",content:"Законный режим — совместная собственность супругов на нажитое в браке. Не является совместным: добрачное имущество, подарки, наследство. Брачный договор — об имущественных правах (до и во время брака, нотариальная форма). Алименты: родители содержат несовершеннолетних детей. Размер: 1 ребёнок — ¼ дохода, 2 — ⅓, 3 и более — ½."},
      {title:"Трудовое право: трудовой договор",content:"Трудовой договор — соглашение между работником и работодателем. Содержание: место работы, должность, зарплата, режим труда, дата начала. Испытательный срок — не более 3 месяцев (для руководителей — 6). Виды: бессрочный (основной) и срочный (до 5 лет). Минимальный возраст: 16 лет (с 14 — лёгкий труд с согласия родителей)."},
      {title:"Трудовое право: гарантии работника",content:"МРОТ — устанавливается федерально. Рабочее время: не более 40 часов в неделю. Несовершеннолетние: до 16 лет — 24 ч/нед., 16–18 лет — 35 ч/нед. Отпуск: ежегодный оплачиваемый — не менее 28 календарных дней. Увольнение по инициативе работодателя: сокращение с выходным пособием; нарушение — без пособия. Нельзя уволить: беременных, матерей до 3 лет, во время больничного."}
    ]},
    {day:"День 24",theme:"Уголовное и административное право",tasks:["Изучить признаки преступления и виды наказаний","Разобрать административные правонарушения и санкции","Решить 5 ситуационных задач по уголовному праву"],tip:"Уголовная ответственность с 16 лет, а за тяжкие преступления — с 14. Это часто спрашивают",theory:[
      {title:"Уголовное право: преступление",content:"Преступление — виновное общественно опасное деяние, запрещённое УК РФ. Признаки: общественная опасность, противоправность, виновность (умысел или неосторожность), наказуемость. Состав преступления: объект (что охраняется), объективная сторона (деяние, последствия), субъект (лицо), субъективная сторона (вина). Категории: небольшой тяжести, средней тяжести, тяжкие, особо тяжкие."},
      {title:"Уголовная ответственность и наказание",content:"Общий возраст — 16 лет. С 14 лет — за особо опасные преступления: убийство, умышленное причинение тяжкого вреда здоровью, изнасилование, разбой, грабёж, кража, угон и др. Виды наказаний: штраф, лишение права занимать должности, обязательные работы, исправительные работы, ограничение свободы, лишение свободы. К несовершеннолетним — более мягкие меры. Смертная казнь — мораторий в РФ."},
      {title:"Административное право",content:"Регулирует отношения в сфере государственного управления. Административное правонарушение — противоправное виновное действие, за которое КоАП РФ предусматривает ответственность. Отличие от преступления: меньшая степень общественной опасности. Административная ответственность — с 16 лет. Наказания: предупреждение, штраф, конфискация, лишение специального права, административный арест (до 15 суток), дисквалификация."},
      {title:"Процессуальное право (основы)",content:"Гражданский процесс — споры о правах (иск, истец и ответчик, доказательства). Уголовный процесс — стадии: возбуждение → расследование → прокурор → суд → приговор. Принципы: законность, равенство сторон, состязательность, презумпция невиновности (обвиняемый не обязан доказывать свою невиновность). Конституционный суд — проверяет соответствие законов Конституции."}
    ]},
    {day:"День 25",theme:"Международное право и права человека",tasks:["Изучить источники международного права","Разобрать механизм защиты прав человека","Написать развёрнутый ответ на задание о правах человека"],tip:"ЕКПЧ и Всеобщая декларация прав человека — ключевые международные документы",theory:[
      {title:"Международное право: понятие и источники",content:"Международное право — система норм, регулирующих отношения между государствами. Принципы (Устав ООН): суверенное равенство государств, запрет применения силы, невмешательство, равноправие народов. Источники: международные договоры, международные обычаи, общие принципы права, решения международных организаций. Ратификация — утверждение договора парламентом страны."},
      {title:"ООН и международные организации",content:"ООН (1945, 193 государства). Органы: Генеральная Ассамблея, Совет Безопасности (5 постоянных членов с правом вето: РФ, США, Китай, Великобритания, Франция), Секретариат, Международный суд ООН. Специализированные: ВОЗ, ЮНЕСКО, МОТ, МВФ. НАТО, ВТО, ШОС, БРИКС — иные международные организации."},
      {title:"Права человека в международном праве",content:"Всеобщая декларация прав человека (ООН, 1948) — первый универсальный документ. Международные пакты 1966 года: о гражданских и политических правах; об экономических, социальных и культурных правах. Европейская конвенция о защите прав человека (ЕКПЧ, 1950). Поколения прав: I — гражданские и политические; II — социальные и экономические; III — коллективные (право на мир, чистую среду)."},
      {title:"Механизмы защиты прав человека",content:"На международном уровне: Совет ООН по правам человека (Женева), Комитет ООН по правам человека, Европейский суд по правам человека (ЕСПЧ, Страсбург) — рассматривает индивидуальные жалобы против государств. На национальном уровне: суды, Уполномоченный по правам человека (омбудсмен), прокуратура. Правозащитные организации: Amnesty International, Human Rights Watch."}
    ]},
    {day:"День 26–27",theme:"МЕГАПОВТОРЕНИЕ: все 5 блоков",tasks:["День 26 — повторение «Человек» и «Экономика» по флэш-картам (60+ карточек)","День 27 — повторение «Социология», «Политика», «Право»","Прорешать 2 полных пробных варианта целиком (3 ч 55 мин)"],tip:"Используй технику «объясни другу»: проговори тему вслух, как будто обучаешь кого-то",theory:[
      {title:"Мегасхема: 5 блоков ЕГЭ",content:"Блок 1 «Человек»: познание, деятельность, личность, общество, культура. Блок 2 «Экономика»: факторы, рынок, фирма, макроэкономика, банки, рынок труда. Блок 3 «Социальные отношения»: стратификация, мобильность, нации, семья, нормы и контроль. Блок 4 «Политика»: власть, государство, демократия, выборы, партии. Блок 5 «Право»: система права, Конституция РФ, гражданское, семейное, трудовое, уголовное, административное, международное право."},
      {title:"Топ-20 понятий ЕГЭ",content:"1. Деятельность и её структура. 2. Истина. 3. Социализация. 4. Типы общества. 5. Глобализация. 6. ВВП и инфляция. 7. Спрос и предложение. 8. Налоги (прямые/косвенные). 9. Безработица (виды). 10. Стратификация и мобильность. 11. Нация и этнос. 12. Семья (функции). 13. Демократия (принципы). 14. Форма государства. 15. Избирательная система. 16. Норма права. 17. Конституционный строй РФ. 18. Права гражданина. 19. Виды юрответственности. 20. Гражданская дееспособность."},
      {title:"Разбор типичных заданий части 2",content:"Задание 17: Составить план (3–5 заголовков по структуре текста). Задание 18: Найти информацию в тексте (цитируй, перефразируй). Задание 19: Примеры/объяснения (часть из текста, часть — своя). Задание 20: Знания курса (текст — только контекст). Задание 21 (задача): Назови норму, отрасль, квалифицируй ситуацию. Задание 22 (понятие): Определение + 2 предложения-раскрытия. Задание 23 (план): 3+ пунктов, каждый с 2–3 подпунктами. Задание 24 (эссе): Смысл + тезис + 2 аргумента с примерами + вывод."},
      {title:"Что проверять при работе над ошибками",content:"Шаг 1: Запиши номер каждого задания с ошибкой. Шаг 2: Определи тему (блок, раздел). Шаг 3: Найди причину: незнание теории? непонимание вопроса? невнимательность? Шаг 4: Прочитай теорию по этой теме. Шаг 5: Реши 5–7 аналогичных заданий. Шаг 6: Через 3 дня вернись к теме снова. Инструменты: сборники Котовой/Лисковой, reshuege.ru, демоверсия ФИПИ текущего года."}
    ]},
    {day:"День 28–29",theme:"Работа над ошибками + слабые места",tasks:["Проанализировать ошибки в пробных вариантах","Выписать темы с наибольшим числом ошибок","Повторить слабые темы и решить 20 заданий по ним"],tip:"80% ошибок приходится на 20% тем. Найди свои слабые места и закрой их",theory:[
      {title:"Сложные темы экономики",content:"Номинальный ВВП — в текущих ценах; реальный = номинальный / дефлятор. Постоянные издержки НЕ зависят от объёма (аренда); переменные — ЗАВИСЯТ (сырьё). Прямой налог платит тот, кто зарабатывает (НДФЛ); косвенный — конечный потребитель (НДС). Инфляция спроса — «много денег»; инфляция издержек — дорогое сырьё/труд. Ставка ЦБ растёт → кредиты дороже → потребление падает → инфляция снижается."},
      {title:"Сложные темы права",content:"Правоспособность с рождения — у ВСЕХ. Дееспособность полная — с 18 лет, НО: эмансипация с 16; подростки 14–18 — ограниченная. Ничтожная сделка недействительна сразу; оспоримая — только по решению суда. Алименты: 1 ребёнок — ¼, 2 — ⅓, 3+ — ½. Уголовная ответственность с 14 лет только за конкретные преступления! Административная — с 16 лет. Гражданско-правовая — с 0 (через родителей)."},
      {title:"Сложные темы политики",content:"Парламентская республика ≠ монархия. В парламентской — правительство ответственно перед парламентом (Италия, Германия). В президентской — перед президентом (США). РФ — смешанная. Унитарное государство ≠ авторитаризм. Пропорциональная система — по партийным спискам. Мажоритарная — по одномандатным округам. В ГД РФ — смешанная (225+225). Легитимность — признание обществом; легальность — соответствие закону: это разные понятия."},
      {title:"Сложные темы социологии",content:"Вертикальная мобильность — изменение СТАТУСА (вверх или вниз). Горизонтальная — смена без изменения статуса. Ассимиляция — поглощение меньшинства большинством; ≠ интеграция. Девиантное поведение бывает ПОЗИТИВНЫМ (героизм, гениальность). Делинквентное — всегда нарушение ПРАВОВЫХ норм. Семья: нуклеарная — только родители+дети; расширенная — с бабушками, дедушками. Функции семьи не путай с функциями государства."}
    ]},
    {day:"День 30",theme:"Финальный день: стратегия и спокойствие",tasks:["Прочитать конспекты по диагонали — освежить память","Повторить структуру эссе и алгоритм составления планов","НЕ решать новые задания — только отдых и уверенность"],tip:"За день до экзамена не учи ничего нового. Ты уже всё знаешь — просто выспись",theory:[
      {title:"Стратегия экзамена: первые 10 минут",content:"Получив КИМ: просмотри весь вариант за 2–3 минуты. Оцени сложность заданий части 2. Начни с части 1 — она создаёт уверенность. Если застрял — пропусти, вернись позже. Не трать на одно задание больше 3 минут в части 1. Записывай черновики сразу — потом перепишешь."},
      {title:"Стратегия экзамена: часть 2",content:"Работай с текстом последовательно: 17 → 18 → 19 → 20. Задания 21–23: пиши структурированно, выделяй ответы. Эссе (задание 24): потрать 5 минут на план до того, как писать. Проверяй: раскрыт ли смысл? Есть ли тезис? Два аргумента с примерами? Вывод? Оставь 15–20 минут на финальную проверку."},
      {title:"Финальная шпаргалка: числа и формулы",content:"НДФЛ — 13%. НДС — 20%. Налог на прибыль — 20%. Рабочая неделя — 40 часов. Ежегодный отпуск — 28 дней. Брачный возраст — 18 лет. Уголовная ответственность — с 16 лет (с 14 за тяжкие). Исковая давность — 3 года. Алименты: ¼, ⅓, ½. Президент: 6 лет, не более 2 сроков подряд, с 35 лет. ГД: 5 лет, 450 депутатов, барьер 5%. Прибыль = Выручка − Издержки. ВВП реальный = Номинальный / Дефлятор."},
      {title:"Психологическая подготовка",content:"Накануне: лечь спать до 23:00. Подготовить всё с вечера (паспорт, СНИЛС, ручки, вода, перекус). Утром: лёгкий завтрак. На экзамене: паника — 5 глубоких вдохов, сосредоточься на первом задании. Помни: каждый правильный ответ приносит балл. Не знаешь ответ — переходи дальше. Ты готовился 30 дней — доверяй себе."}
    ]}
  ]}
];

const STRATEGIES = [
  {icon:"⏱",title:"Распределение времени на экзамене",body:"Часть 1 (задания 1–16): ~60 мин. Часть 2 (задания 17–24): ~115 мин. Эссе (задание 24): ~40 мин. Оставь 20 минут на проверку."},
  {icon:"📝",title:"Структура эссе",body:"1. Смысл высказывания (своими словами). 2. Тезис (своя позиция). 3. Аргумент 1 + конкретный пример. 4. Аргумент 2 + конкретный пример. 5. Вывод."},
  {icon:"📋",title:"Как писать план",body:"Минимум 3 пункта, каждый с 2–3 подпунктами. Пункты должны раскрывать тему, а не просто называть её. Проверь: по плану можно написать полноценный текст?"},
  {icon:"📖",title:"Работа с текстом (17–20)",body:"Сначала читай вопросы, потом текст. Ищи «сигнальные» слова. Цитируй и перефразируй — не придумывай. На вопрос «приведите примеры» давай конкретику."},
  {icon:"🧠",title:"Техника запоминания терминов",body:"Флэш-карты (термин — определение). Метод «трёх повторений»: через 1 день, через 3 дня, через 7 дней. Создавай ассоциации и мини-истории для сложных понятий."},
  {icon:"✅",title:"Топ-5 самых частых тем",body:"1. Демократия и её принципы. 2. Рыночная экономика. 3. Права гражданина РФ. 4. Социальная стратификация. 5. Виды юридической ответственности."},
];

// STATE
let state = {week:0,day:0,done:{},theoryOpen:null};

function save(){try{localStorage.setItem('ege_state',JSON.stringify(state))}catch(e){}}
function load(){try{const s=localStorage.getItem('ege_state');if(s){const p=JSON.parse(s);state.done=p.done||{};state.week=p.week||0;state.day=p.day||0;}}catch(e){}}
load();

// COUNTS
function totalTasks(){return DATA.flatMap(w=>w.days).flatMap(d=>d.tasks).length}
function doneTasks(){return Object.values(state.done).filter(Boolean).length}

function updateProgress(){
  const t=totalTasks(),d=doneTasks(),pct=Math.round(d/t*100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('pfill').style.width=pct+'%';
  document.getElementById('pcnt').textContent=d+'/'+t+' заданий';
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['plan','strategy'][i]===tab));
  document.getElementById('plan-tab').style.display=tab==='plan'?'flex':'none';
  document.getElementById('strategy-tab').style.display=tab==='strategy'?'block':'none';
}

function gotoDay(wi,di){
  state.week=wi;state.day=di;state.theoryOpen=null;save();
  renderSidebar();renderContent();
}

function renderSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='';
  DATA.forEach((w,wi)=>{
    const wh=document.createElement('button');
    wh.className='week-header';
    wh.style.borderLeftColor=state.week===wi?w.color:'transparent';
    wh.style.background=state.week===wi?w.color+'18':'none';
    wh.innerHTML=`<div class="week-label" style="color:${w.color}">Неделя ${w.num}</div><div class="week-title-text">${w.title.split('+')[0].trim()}</div>`;
    wh.onclick=()=>gotoDay(wi,0);
    sb.appendChild(wh);
    if(state.week===wi){
      w.days.forEach((d,di)=>{
        const allDone=d.tasks.every((_,ti)=>state.done[`${wi}-${di}-${ti}`]);
        const db=document.createElement('button');
        db.className='day-btn-side'+(state.day===di?' active':'');
        db.innerHTML=`<div class="day-dot" style="background:${allDone?w.color:'#3a3548'}"></div><span class="day-label-text">${d.day}</span>`;
        db.onclick=()=>gotoDay(wi,di);
        sb.appendChild(db);
      });
    }
  });
}

function renderContent(){
  const c=document.getElementById('content');
  const w=DATA[state.week],d=w.days[state.day];
  c.className='fade-in';
  // Reset animation
  void c.offsetWidth;

  let html=`
    <div class="day-label-top" style="color:${w.color}">Неделя ${w.num} · ${d.day}</div>
    <div class="day-title">${d.theme}</div>
    <div class="tip-box" style="background:${w.color}12;border:1px solid ${w.color}28">
      <span style="font-size:16px">💡</span>
      <div><div class="tip-label" style="color:${w.color}">Совет дня</div><div class="tip-text">${d.tip}</div></div>
    </div>
    <div class="section-label">📚 Теория для изучения</div>
  `;

  d.theory.forEach((th,ti)=>{
    const key=`t-${state.week}-${state.day}-${ti}`;
    const isOpen=state.theoryOpen===key;
    html+=`
      <div class="theory-block${isOpen?' open':''}" id="tb-${ti}">
        <button class="theory-toggle" onclick="toggleTheory('${key}',${ti})">
          <div class="theory-toggle-left">
            <div class="theory-num" style="background:${w.color}22;border:1px solid ${w.color}40;color:${w.color}">T${ti+1}</div>
            <span class="theory-toggle-title">${th.title}</span>
          </div>
          <span class="theory-arrow" style="color:${w.color}">▾</span>
        </button>
        <div class="theory-body" style="background:${w.color}06;border-top-color:${w.color}20">
          <p class="theory-content">${th.content}</p>
        </div>
      </div>
    `;
  });

  html+=`<div class="section-label" style="margin-top:18px">✅ Задания на день</div>`;
  d.tasks.forEach((task,ti)=>{
    const key=`${state.week}-${state.day}-${ti}`;
    const isDone=!!state.done[key];
    html+=`
      <div class="task-item${isDone?' done':''}" style="${isDone?`border-color:${w.color}28;background:${w.color}0e`:''}" onclick="toggleTask(${state.week},${state.day},${ti})">
        <div class="task-check" style="${isDone?`background:${w.color};border-color:${w.color}`:''}">
          <span class="task-check-icon">✓</span>
        </div>
        <span class="task-text">${task}</span>
      </div>
    `;
  });

  // Week progress
  html+=`<div class="week-prog-box" style="margin-top:18px">
    <div class="week-prog-label">Прогресс недели ${w.num}</div>
    <div class="week-prog-bars">`;
  w.days.forEach((dd,di)=>{
    const allDone=dd.tasks.every((_,ti)=>state.done[`${state.week}-${di}-${ti}`]);
    const anyDone=dd.tasks.some((_,ti)=>state.done[`${state.week}-${di}-${ti}`]);
    const bg=allDone?w.color:anyDone?w.color+'55':'#2a2535';
    html+=`<div class="week-prog-bar" style="background:${bg}" onclick="gotoDay(${state.week},${di})" title="${dd.day}"></div>`;
  });
  html+=`</div></div>`;

  // Nav
  const hasPrev=state.day>0||state.week>0;
  const hasNext=state.day<w.days.length-1||state.week<DATA.length-1;
  html+=`<div class="nav-row">
    <button class="btn-back" onclick="navDay(-1)" ${hasPrev?'':' style="opacity:.3;cursor:default"'}>← Назад</button>
    <button class="btn-next" style="background:${w.color}" onclick="navDay(1)" ${hasNext?'':' style="opacity:.3;cursor:default"'}>Следующий день →</button>
  </div>`;

  c.innerHTML=html;
}

function toggleTheory(key,ti){
  state.theoryOpen=state.theoryOpen===key?null:key;
  const block=document.getElementById('tb-'+ti);
  if(!block)return;
  if(state.theoryOpen===key){block.classList.add('open');}
  else{block.classList.remove('open');}
}

function toggleTask(wi,di,ti){
  const key=`${wi}-${di}-${ti}`;
  state.done[key]=!state.done[key];
  save();
  updateProgress();
  renderSidebar();
  renderContent();
}

function navDay(dir){
  const w=DATA[state.week];
  if(dir===1){
    if(state.day<w.days.length-1){gotoDay(state.week,state.day+1);}
    else if(state.week<DATA.length-1){gotoDay(state.week+1,0);}
  } else {
    if(state.day>0){gotoDay(state.week,state.day-1);}
    else if(state.week>0){gotoDay(state.week-1,DATA[state.week-1].days.length-1);}
  }
}

function renderStrategy(){
  const s=document.getElementById('strategy-tab');
  let html=`
    <h2 class="playfair" style="font-size:22px;color:#f0e8d8;margin-bottom:4px">Стратегии и советы</h2>
    <p style="color:#5a5468;font-size:13px;margin-bottom:20px">Проверенные техники для максимального балла</p>
    <div class="strat-grid">
  `;
  STRATEGIES.forEach(s=>{
    html+=`<div class="strat-card"><div class="strat-icon">${s.icon}</div><div class="strat-title">${s.title}</div><div class="strat-body">${s.body}</div></div>`;
  });
  html+=`</div>
    <div class="score-box">
      <div class="score-title playfair">🎯 Ориентиры по баллам</div>
      <div class="score-grid">
  `;
  [["60+","Бюджет в региональных вузах","#7eb8a4"],["75+","Хорошие вузы страны","#c8a96e"],["85+","Топовые вузы (МГУ, ВШЭ)","#a07eb8"],["90+","Высокий балл + стипендия","#e07878"]].forEach(([pts,desc,col])=>{
    html+=`<div class="score-item" style="background:${col}12;border:1px solid ${col}28"><div class="score-pts playfair" style="color:${col}">${pts} баллов</div><div class="score-desc">${desc}</div></div>`;
  });
  html+=`</div></div>
    <div class="score-box" style="margin-top:14px">
      <div class="score-title playfair">📊 Структура ЕГЭ 2025</div>
      <div class="score-grid">
        <div class="score-item" style="background:#c8a96e12;border:1px solid #c8a96e28">
          <div class="score-pts playfair" style="color:#c8a96e;font-size:14px">Часть 1</div>
          <div style="font-size:12px;color:#c8c0b0;margin:3px 0">Задания 1–16</div>
          <div class="score-desc">Краткий ответ · до 38 баллов</div>
        </div>
        <div class="score-item" style="background:#7eb8a412;border:1px solid #7eb8a428">
          <div class="score-pts playfair" style="color:#7eb8a4;font-size:14px">Часть 2</div>
          <div style="font-size:12px;color:#c8c0b0;margin:3px 0">Задания 17–24</div>
          <div class="score-desc">Развёрнутые ответы · до 62 баллов</div>
        </div>
      </div>
      <div style="margin-top:12px;padding:10px;background:rgba(200,169,110,.08);border-radius:8px;text-align:center;font-size:12px;color:#c8a96e">
        ⏱ Общее время: <strong>3 часа 55 минут</strong> · Максимальный балл: <strong>100</strong>
      </div>
    </div>
  `;
  s.innerHTML=html;
}

// INIT
switchTab('plan');
renderSidebar();
renderContent();
renderStrategy();
updateProgress();
</script>
</body>
</html>
